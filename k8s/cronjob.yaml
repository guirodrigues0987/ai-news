# CronJob for the AI news podcast. Runs every day at 6am (Brasilia time).
# The image comes from Docker Hub (private repo guilhermerodrigues00/ai_agent),
# pulled via the "dockerhub-creds" imagePullSecret. Episodes are written via
# hostPath to /home/home_lab/ai-news/output - single-node cluster, so the mp3s
# can be browsed directly in the file manager, with no sudo or "kubectl cp".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-news-podcast
  namespace: ai-news
spec:
  schedule: "0 6 * * *"
  timeZone: "America/Sao_Paulo"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-creds
          containers:
            - name: ai-news-podcast
              image: guilhermerodrigues00/ai_agent:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: ai-news-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: output
                  mountPath: /app/output
          volumes:
            - name: output
              hostPath:
                path: /home/home_lab/ai-news/output
                type: DirectoryOrCreate
