# PersistentVolumeClaim para guardar os episódios gerados (/app/output no
# container). Usa a storageclass "local-path" (default do k3s, provisiona
# sob demanda no disco local do node).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-news-output
  namespace: ai-news
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
