# CronJob do podcast de notícias de IA. Roda todo dia às 6h (horário de
# Brasília). Imagem vem do Docker Hub (repo privado
# guilhermerodrigues00/ai_agent), puxada via o imagePullSecret
# "dockerhub-creds". Os episódios são gravados via hostPath em
# /home/home_lab/ai-news/output — cluster de nó único, então dá pra
# acessar os mp3 direto pelo gerenciador de arquivos, sem precisar de
# sudo nem de "kubectl cp".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-news-podcast
  namespace: ai-news
spec:
  schedule: "0 6 * * *"
  timeZone: "America/Sao_Paulo"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-creds
          containers:
            - name: ai-news-podcast
              image: guilhermerodrigues00/ai_agent:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: ai-news-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: output
                  mountPath: /app/output
          volumes:
            - name: output
              hostPath:
                path: /home/home_lab/ai-news/output
                type: DirectoryOrCreate
